<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolling Kelas</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0;--m:#38bdf8;--f:#f472b6;--ok:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:16px}
  h1{margin:0 0 12px;font-size:22px}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:16px;max-width:1300px;margin:auto}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:14px;padding:14px}
  textarea{width:100%;height:90px;background:#0b1220;color:var(--txt);border:1px solid #334155;border-radius:8px;padding:8px;resize:vertical}
  label{font-size:13px;font-weight:600}
  .m{color:var(--m)}.f{color:var(--f)}
  button{background:#334155;color:var(--txt);border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600}
  button:hover{background:#475569}
  button.primary{background:#2563eb}
  button:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .wheelbox{position:relative;width:300px;margin:10px auto}
  canvas{width:300px;height:300px;display:block}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid #facc15;z-index:2}
  .status{text-align:center;font-weight:700;min-height:24px}
  .room{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  .sec h3{text-align:center;margin:0 0 8px;font-size:14px;opacity:.8}
  .grid{display:grid;gap:6px}
  .seat{width:86px;height:44px;border-radius:8px;border:2px dashed #475569;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:2px;line-height:1.1;overflow:hidden}
  .seat.em{border-color:var(--m)}.seat.ef{border-color:var(--f)}
  .seat.next{box-shadow:0 0 0 3px #facc15}
  .seat.fm{background:rgba(56,189,248,.2);border-style:solid;border-color:var(--m)}
  .seat.ff{background:rgba(244,114,182,.2);border-style:solid;border-color:var(--f)}
  .board{text-align:center;background:#475569;border-radius:8px;padding:6px;margin-bottom:12px;font-weight:700}
  small{opacity:.7}
</style>
</head>
<body>
<h1>🎡 Rolling Kelas</h1>
<div class="wrap">
  <div>
    <div class="card">
      <label class="m">Nama Cowok (1 baris 1 nama)</label>
      <textarea id="males"></textarea>
      <label class="f">Nama Cewek (1 baris 1 nama)</label>
      <textarea id="females"></textarea>
      <div class="row">
        <label>Mulai baris pertama:</label>
        <select id="start"><option value="M">Cowok</option><option value="F">Cewek</option></select>
        <button id="save">Simpan</button>
      </div>
      <small>Kiri & kanan: 2 meja/baris (2 cowok → 2 cewek → dst). Tengah: 3 meja/baris (3 cowok → 3 cewek → dst).</small>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="status" id="status">Simpan nama dulu</div>
      <div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="600" height="600"></canvas></div>
      <div class="row" style="justify-content:center">
        <button class="primary" id="spin">SPIN</button>
        <button id="shuffle">Shuffle Semua</button>
        <button id="reset">Reset</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="board">PAPAN TULIS / DEPAN</div>
    <div class="room" id="room"></div>
    <div class="row" style="justify-content:center"><small><span class="m">■</span> cowok &nbsp; <span class="f">■</span> cewek &nbsp; (kotak kuning = meja berikutnya)</small></div>
  </div>
</div>

<script>
const SECS=[{id:'L',name:'Kiri',cols:2},{id:'M',name:'Tengah',cols:3},{id:'R',name:'Kanan',cols:2}];
const ROWS=5;
let seats=[],males=[],females=[],startG='M',spinning=false,rot=0,pool=[];

const $=id=>document.getElementById(id);
const canvas=$('wheel'),ctx=canvas.getContext('2d');

function buildSeats(){
  seats=[];
  SECS.forEach(s=>{
    for(let r=0;r<ROWS;r++)for(let c=0;c<s.cols;c++){
      const first=startG, other=startG==='M'?'F':'M';
      seats.push({sec:s.id,row:r,col:c,g:r%2===0?first:other,name:null,pg:null});
    }
  });
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('rolling-kelas')||'{}');
    $('males').value=d.m||'';$('females').value=d.f||'';startG=d.s||'M';$('start').value=startG;
    seats=d.seats&&d.seats.length===35?d.seats:[];
  }catch(e){}
  parse();
  if(!seats.length)buildSeats();
}
function parse(){
  const p=t=>[...new Set(t.split('\n').map(x=>x.trim()).filter(Boolean))];
  males=p($('males').value);females=p($('females').value);
}
function persist(){
  try{localStorage.setItem('rolling-kelas',JSON.stringify({m:$('males').value,f:$('females').value,s:startG,seats}))}catch(e){}
}
function used(){return new Set(seats.filter(s=>s.name).map(s=>s.name))}
function nextIdx(){return seats.findIndex(s=>!s.name)}
function remaining(g){const u=used();return (g==='M'?males:females).filter(n=>!u.has(n))}

function currentPool(){
  const i=nextIdx();if(i<0)return {g:null,list:[]};
  let g=seats[i].g,list=remaining(g);
  if(!list.length){g=g==='M'?'F':'M';list=remaining(g)} // fallback kalau jenis ini habis
  return {g,list};
}

function drawWheel(){
  const W=canvas.width,R=W/2;ctx.clearRect(0,0,W,W);
  const {g,list}=currentPool();pool=list;
  if(!list.length){
    ctx.fillStyle='#334155';ctx.beginPath();ctx.arc(R,R,R-6,0,7);ctx.fill();
    ctx.fillStyle='#e2e8f0';ctx.font='bold 36px sans-serif';ctx.textAlign='center';
    ctx.fillText(nextIdx()<0?'Selesai!':'Nama habis',R,R+12);return;
  }
  const a=2*Math.PI/list.length,base=g==='M'?['#0ea5e9','#0369a1']:['#ec4899','#9d174d'];
  list.forEach((n,i)=>{
    ctx.beginPath();ctx.moveTo(R,R);
    ctx.arc(R,R,R-6,rot+i*a-Math.PI/2,rot+(i+1)*a-Math.PI/2);ctx.closePath();
    ctx.fillStyle=base[i%2];ctx.fill();ctx.strokeStyle='#0f172a';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(R,R);ctx.rotate(rot+(i+.5)*a-Math.PI/2);
    ctx.fillStyle='#fff';ctx.textAlign='right';
    ctx.font=`bold ${Math.max(14,Math.min(30,260/Math.max(list.length,6)*1.6))}px sans-serif`;
    ctx.fillText(n.length>14?n.slice(0,13)+'…':n,R-24,8);ctx.restore();
  });
  ctx.beginPath();ctx.arc(R,R,26,0,7);ctx.fillStyle='#0f172a';ctx.fill();
}

function renderRoom(){
  const room=$('room');room.innerHTML='';
  const ni=nextIdx();
  SECS.forEach(s=>{
    const sec=document.createElement('div');sec.className='sec';
    sec.innerHTML=`<h3>${s.name} (${s.cols*ROWS} meja)</h3>`;
    const grid=document.createElement('div');grid.className='grid';
    grid.style.gridTemplateColumns=`repeat(${s.cols},86px)`;
    seats.forEach((st,i)=>{
      if(st.sec!==s.id)return;
      const d=document.createElement('div');
      d.className='seat '+(st.name?(st.pg==='M'?'fm':'ff'):(st.g==='M'?'em':'ef'))+(i===ni?' next':'');
      d.textContent=st.name||(st.g==='M'?'♂':'♀');
      grid.appendChild(d);
    });
    sec.appendChild(grid);room.appendChild(sec);
  });
  const {g,list}=currentPool();
  const done=seats.filter(s=>s.name).length;
  $('status').innerHTML=ni<0?'✅ Semua meja terisi!':
    `Meja ${done+1}/35 — mode <span class="${g==='M'?'m':'f'}">${g==='M'?'COWOK':'CEWEK'}</span> (${list.length} nama)`;
  $('spin').disabled=spinning||ni<0||!list.length;
  $('shuffle').disabled=spinning;
  drawWheel();persist();
}

function place(name,g){
  const i=nextIdx();if(i<0)return;
  seats[i].name=name;seats[i].pg=g;
}

$('spin').onclick=()=>{
  if(spinning||!pool.length)return;
  const {g}=currentPool();
  const idx=Math.floor(Math.random()*pool.length),a=2*Math.PI/pool.length;
  const target=-(idx+.5)*a;
  const delta=(((target-rot)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)+2*Math.PI*6;
  const start=rot,dur=4200,t0=performance.now(),winner=pool[idx];
  spinning=true;$('spin').disabled=true;$('shuffle').disabled=true;
  (function step(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);
    rot=start+delta*e;drawWheel();
    if(p<1)requestAnimationFrame(step);
    else{spinning=false;rot=rot%(2*Math.PI);place(winner,g);renderRoom();}
  })(t0);
};

$('shuffle').onclick=()=>{
  if(spinning)return;
  const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  seats.forEach(s=>{s.name=null;s.pg=null});
  let m=sh(males),f=sh(females);
  seats.forEach(s=>{
    let g=s.g;
    if(g==='M'&&!m.length)g='F';
    if(g==='F'&&!f.length)g='M';
    const src=g==='M'?m:f;
    if(src.length){s.name=src.shift();s.pg=g}
  });
  // isi urut: kosong di tengah tidak diizinkan
  const filled=seats.filter(s=>s.name),empty=seats.filter(s=>!s.name);
  const ordered=[...filled,...empty];
  seats.forEach((s,i)=>{s.name=ordered[i].name;s.pg=ordered[i].pg});
  renderRoom();
};

$('reset').onclick=()=>{if(spinning)return;buildSeats();renderRoom()};
$('save').onclick=()=>{
  if(spinning)return;
  startG=$('start').value;parse();buildSeats();renderRoom();
};

load();renderRoom();
</script>
</body>
</html>
