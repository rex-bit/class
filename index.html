<style>
:root{
  --primary:#386a20;--on-primary:#fff;
  --pc:#b7f397;--on-pc:#072100;
  --sc:#d7e8cd;--on-sc:#101f0b;
  --bg:#fdfdf5;--on-bg:#1a1c18;
  --s1:#f4f6ec;--s2:#eef1e5;--s3:#e8ebdf;--s4:#e0e4d9;
  --outline:#74796d;--ov:#c3c8bb;--onv:#43483e;
  --m:#2f6fb8;--m2:#5b97dc;--mc:#d3e4ff;--on-mc:#001c3b;
  --f:#b0356f;--f2:#d9669b;--fc:#ffd8e8;--on-fc:#3e001e;
  --shadow:0 1px 3px rgba(0,0,0,.18),0 4px 12px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --primary:#9cd67d;--on-primary:#0b3900;
  --pc:#205107;--on-pc:#b7f397;
  --sc:#3b4b38;--on-sc:#d7e8cd;
  --bg:#11140f;--on-bg:#e2e3dc;
  --s1:#191d16;--s2:#1e221b;--s3:#272b24;--s4:#32362e;
  --outline:#8d9387;--ov:#43483e;--onv:#c3c8bb;
  --mc:#00468a;--on-mc:#d3e4ff;--fc:#6b0a3a;--on-fc:#ffd8e8;
}}
:root[data-theme=dark]{
  --primary:#9cd67d;--on-primary:#0b3900;
  --pc:#205107;--on-pc:#b7f397;
  --sc:#3b4b38;--on-sc:#d7e8cd;
  --bg:#11140f;--on-bg:#e2e3dc;
  --s1:#191d16;--s2:#1e221b;--s3:#272b24;--s4:#32362e;
  --outline:#8d9387;--ov:#43483e;--onv:#c3c8bb;
  --mc:#00468a;--on-mc:#d3e4ff;--fc:#6b0a3a;--on-fc:#ffd8e8;
}
:root[data-theme=dark]{color-scheme:dark}:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Google Sans','Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--on-bg);min-height:100vh;padding-bottom:100px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 20px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 2px 6px rgba(56,106,32,.35))}
.brand small{display:block;font-size:12px;letter-spacing:.08em;color:var(--primary);font-weight:700;text-transform:uppercase}
.brand b{font-size:22px;font-weight:600;line-height:1.1}
.lang{margin-left:auto;position:relative}
.langbtn{border:0;background:var(--sc);color:var(--on-sc);padding:9px 14px;border-radius:100px;font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;gap:6px}
.langbtn svg{width:16px;height:16px;fill:currentColor}
.menu{position:absolute;right:0;top:48px;background:var(--s3);border-radius:18px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none;min-width:180px;z-index:8}
.menu.open{display:block;animation:in .2s ease}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--on-bg);padding:11px 14px;border-radius:12px;cursor:pointer}
.menu button.on{background:var(--sc);color:var(--on-sc)}
main{max-width:760px;margin:0 auto;padding:4px 16px}
section{display:none;animation:in .35s ease}
section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--s2);border-radius:28px;padding:18px;margin-bottom:14px;position:relative}
.card h2{margin:0 0 4px;font-size:16px;font-weight:600}
.hint{font-size:13px;color:var(--onv);margin:0 0 12px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
textarea{width:100%;height:170px;resize:vertical;font:inherit;font-size:14px;line-height:1.5;color:var(--on-bg);background:var(--s1);border:1.5px solid var(--ov);border-radius:16px;padding:12px 14px;outline:none;transition:border-color .2s}
textarea:focus{border-color:var(--primary)}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--ov);border-radius:100px;padding:3px}
.seg button{border:0;background:none;color:var(--onv);padding:8px 16px;border-radius:100px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.25s}
.seg button.on{background:var(--sc);color:var(--on-sc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.btn{border:0;font:inherit;font-weight:600;font-size:14px;padding:12px 22px;border-radius:100px;cursor:pointer;transition:transform .15s,opacity .2s;display:inline-flex;align-items:center;gap:8px}
.btn.sm{padding:9px 16px;font-size:13px}
.btn.big{padding:14px 44px;font-size:16px}
.btn:active{transform:scale(.96)}
.btn.fill{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--sc);color:var(--on-sc)}
.btn.text{background:none;color:var(--primary)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn svg{width:18px;height:18px;fill:currentColor}
.icon{position:absolute;top:12px;right:12px;width:40px;height:40px;border:0;border-radius:50%;background:var(--sc);color:var(--on-sc);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon svg{width:22px;height:22px;fill:currentColor}
.status{display:flex;justify-content:center;margin-bottom:6px;padding:0 48px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;background:var(--sc);color:var(--on-sc)}
.chip.m{background:var(--mc);color:var(--on-mc)}.chip.f{background:var(--fc);color:var(--on-fc)}.chip.ok{background:var(--pc);color:var(--on-pc)}
.wheelbox{position:relative;width:calc(100% - 20px);max-width:330px;margin:14px auto;filter:drop-shadow(0 8px 20px rgba(0,0,0,.18))}
.wheelbox canvas{width:100%;display:block;cursor:pointer}
.pointer{position:absolute;right:-16px;top:50%;transform:translateY(-50%);width:38px;height:38px;z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.progress{height:8px;border-radius:8px;background:var(--s4);overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;width:0;background:var(--primary);border-radius:8px;transition:width .5s}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--m)}
.col.f .dot{background:var(--f)}
.count{margin-left:auto;font-weight:500;color:var(--onv)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{border:0;font:inherit;font-size:12px;font-weight:600;padding:6px 10px;border-radius:10px;cursor:pointer;background:var(--mc);color:var(--on-mc);transition:transform .15s}
.nchip:active{transform:scale(.92)}
.col.f .nchip{background:var(--fc);color:var(--on-fc)}
.nchip.u{outline:1.5px dashed var(--outline);outline-offset:1px}
.hist{display:none;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hchip{border:0;font:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:100px;cursor:pointer;background:var(--s4);color:var(--onv)}
.hchip.on{background:var(--sc);color:var(--on-sc)}
.hnote{flex-basis:100%;font-size:12px;color:var(--onv)}
.room{display:grid;grid-template-columns:2fr 3fr 2fr;gap:12px;align-items:start}
.sec h3{margin:0 0 8px;text-align:center;font-size:12px;font-weight:600;color:var(--onv)}
.grid{display:grid;gap:5px}
.seat{height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:600;line-height:1.1;padding:2px 3px;overflow:hidden;word-break:break-word;border:1.5px dashed var(--ov);color:var(--outline)}
.seat.em{border-color:var(--m2);color:var(--m)}.seat.ef{border-color:var(--f2);color:var(--f)}
.seat.fm{background:var(--mc);color:var(--on-mc);border:0}
.seat.ff{background:var(--fc);color:var(--on-fc);border:0}
.seat.next{outline:2.5px solid var(--primary);outline-offset:2px}
.seat.sm{font-size:9.5px}.seat.xs{font-size:8.5px}
.seat.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
.board{margin:0 auto 14px;max-width:70%;text-align:center;font-size:12px;font-weight:700;letter-spacing:.1em;padding:8px;border-radius:12px;background:var(--s4);color:var(--onv)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--onv);margin-top:14px}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--m)}
.legend span.f::before{background:var(--f)}
/* ===== Liquid glass tab bar (press + drag) ===== */
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(74vw,270px);height:56px;z-index:10;border-radius:28px;
  background:color-mix(in srgb,var(--s3) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.18);padding:5px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:transform .4s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:100%}
.pill{position:absolute;top:0;bottom:0;border-radius:23px;background:var(--pc);left:calc(var(--i,1) * 100% / 3);right:calc((2 - var(--i,1)) * 100% / 3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  transition:left .5s cubic-bezier(.3,1.25,.5,1),right .5s cubic-bezier(.3,1.25,.5,1),transform .35s cubic-bezier(.3,1.6,.5,1)}
.pill.fwd{transition:right .3s cubic-bezier(.3,1.35,.5,1),left .52s cubic-bezier(.3,1.2,.5,1) .05s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.pill.back{transition:left .3s cubic-bezier(.3,1.35,.5,1),right .52s cubic-bezier(.3,1.2,.5,1) .05s,transform .35s cubic-bezier(.3,1.6,.5,1)}
nav.press .pill{transform:scale(1.16,1.3);box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.35)}
nav.drag .pill{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
nav.moving:not(.press) .pill{animation:squish .55s ease}
@keyframes squish{40%{transform:scaleY(.82)}100%{transform:none}}
.tab{border:0;background:none;color:var(--onv);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:inherit;font-size:10px;font-weight:600;cursor:pointer;position:relative;z-index:1;transition:color .3s;pointer-events:none}
.tab svg{width:20px;height:20px;fill:currentColor;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.tab.on{color:var(--on-pc)}
.tab.on svg{transform:scale(1.15)}
nav.press .tab.on svg{transform:scale(1.28)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--primary);color:var(--on-primary);font-size:9px;display:none;align-items:center;justify-content:center;padding:0 4px}
.badge.show{display:flex}
.ptabs{display:none}
/* ===== Desktop / laptop: wheel on the left, Names/Seats panel on the right (like wheelofnames.com) ===== */
@media(min-width:960px){
  body{padding-bottom:24px}
  header{padding:16px max(32px,calc((100vw - 1360px)/2 + 32px))}
  main{max-width:1360px;padding:8px 32px;display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:0 28px;align-items:start}
  section{display:block;animation:none}
  #t1{grid-column:1;grid-row:1 / span 4}
  .ptabs{display:flex;grid-column:2;grid-row:1;border-bottom:1px solid var(--ov);margin-bottom:14px}
  #t0,#t2{grid-column:2;grid-row:2}
  body.s0 #t2,body.s2 #t0{display:none}
  footer{grid-column:1 / -1;grid-row:5}
  nav{display:none}
  .wheelbox{max-width:none;width:min(calc(100% - 20px),560px,58vh);margin:22px auto 26px}
  .card{padding:22px}
  textarea{height:240px}
  .seat{height:54px;font-size:12px}
  .seat.sm{font-size:12px}.seat.xs{font-size:10px}
  .room{gap:16px}
  .btn.big{padding:16px 64px;font-size:18px}
}
.ptab{flex:1;border:0;background:none;font:inherit;font-size:14px;font-weight:700;padding:13px 12px;color:var(--onv);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;justify-content:center;gap:8px}
.ptab.on{color:var(--primary);border-color:var(--primary)}
.ptab .pb{background:var(--primary);color:var(--on-primary);font-size:11px;border-radius:10px;padding:1px 8px}
/* ===== header hides on scroll down, returns on scroll up ===== */
header{transition:transform .35s cubic-bezier(.3,.8,.3,1),box-shadow .3s}
header.hide{transform:translateY(-110%)}
header.scrolled{box-shadow:0 1px 0 rgba(255,255,255,.85),0 2px 14px rgba(0,0,0,.12)}
.hactions{display:none;gap:4px}
.hbtn{border:0;background:none;color:var(--onv);font:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:100px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .2s}
.hbtn:hover{background:var(--sc);color:var(--on-sc)}
.hbtn svg{width:19px;height:19px;fill:currentColor}
.card h2 .hi,.faq h2 .hi{width:20px;height:20px;fill:var(--primary);vertical-align:-4px;margin-right:8px}
.kbd{display:none}
/* FAQ + footer */
.faq{margin:34px 0 8px}
.faq h2{font-size:20px;margin:0 0 14px}
.faq details{background:var(--s2);border-radius:20px;padding:0 20px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:600;font-size:15px;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';font-size:24px;font-weight:400;color:var(--primary);transition:transform .25s;flex:none}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details>p{margin:0 0 14px;font-size:14px;line-height:1.65;color:var(--onv)}
.faq details>.row{padding-bottom:16px}
.flinks{display:flex;gap:4px 6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
a.flink{text-decoration:none;display:inline-block}
.flink{border:0;background:none;color:var(--primary);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:100px}
.flink:hover{background:var(--sc)}
.wincard.policy{text-align:left;max-width:600px;width:92vw;max-height:84vh;overflow:auto;padding:26px 28px}
.policy h3{margin:0 0 2px;font-size:22px}
.policy .upd{font-size:12px;color:var(--onv);margin-bottom:10px}
.policy h4{margin:16px 0 4px;font-size:14px}
.policy p{margin:0;font-size:13.5px;line-height:1.6;color:var(--onv)}
.policy .row{margin-top:20px}
@media(min-width:960px){
  .hactions{display:flex;margin-left:auto}.lang{margin-left:4px}
  .kbd{display:block}
  body{background:radial-gradient(900px 520px at 27% 4%,color-mix(in srgb,var(--pc) 40%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
  #t1 .card{background:transparent;padding:0;margin-bottom:0}
  .wheelbox{width:min(calc(100% - 20px),680px,62vh)}
  .faq{grid-column:1 / -1;grid-row:5;max-width:860px;width:100%;margin:64px auto 12px}
  footer{grid-row:6}
}
@media print{
  :root{--bg:#fff;--on-bg:#000;--s2:#fff;--s4:#eee;--onv:#333;--mc:#d3e4ff;--on-mc:#001c3b;--fc:#ffd8e8;--on-fc:#3e001e;--ov:#bbb;--outline:#666;--m:#2f6fb8;--m2:#2f6fb8;--f:#b0356f;--f2:#b0356f}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff!important;padding:0}
  header,nav,.ptabs,#t0,#t1,.faq,footer,.hist,#toasts,.win,.noprint{display:none!important}
  main{display:block!important;padding:0}
  #t2{display:block!important;animation:none}
  .card{background:#fff;box-shadow:none}
}
/* seat icons + settings */
.seat svg{width:22px;height:22px;fill:currentColor;opacity:.8}
header{box-shadow:0 1px 0 rgba(255,255,255,.85),0 1px 0 1px color-mix(in srgb,var(--pc) 22%,transparent)}
header::after{content:'';position:absolute;left:0;right:0;top:100%;height:46px;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 34%,transparent) 0,color-mix(in srgb,var(--pc) 12%,transparent) 45%,transparent 100%)}
body.flat header::after{display:none}
.wincard.cfg{text-align:left;max-width:580px;width:94vw;max-height:86vh;overflow:auto;padding:22px 24px}
.cfg h2{margin:0 0 6px;font-size:20px;text-align:center}
.ctabs{display:flex;gap:2px;justify-content:center;border-bottom:1px solid var(--ov);margin:0 -8px 8px}
.ctabs button{border:0;background:none;color:var(--onv);font:inherit;font-weight:600;font-size:14px;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent}
.ctabs button.on{color:var(--primary);border-color:var(--primary)}
.cp{display:none}.cp.on{display:block}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ov)}
.crow>label{flex:0 0 160px;font-size:14px;font-weight:600}
.crow .grow{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.crow select,.crow input[type=text]{flex:1;min-width:0;font:inherit;font-size:14px;padding:9px 12px;border-radius:12px;border:1px solid var(--ov);background:var(--s1);color:var(--on-bg)}
.crow input[type=range]{flex:1;min-width:0;accent-color:var(--primary)}
.crow output{min-width:44px;text-align:right;font-size:13px;color:var(--onv)}
.crow input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);flex:none}
.crow.chk>label{flex:1}
.crow .btn{padding:8px 12px}

function modelGuess(name){const R=window.RKN;if(!R)return null;
  if(!R.M){R.M=new Set(R.m.split(' '));R.F=new Set(R.f.split(' '))}

    const w=i===0?2:1;

  const c=ac();if(!c)return;const tt=c.currentTime,o=c.createOscillator(),g=c.createGain(),k=cfg.tick;
  let pk=.2;
  if(k==='wood'){o.type='square';o.frequency.setValueAtTime(900,tt);o.frequency.exponentialRampToValueAtTime(300,tt+.03);pk=.07}
  else if(k==='soft'){o.type='sine';o.frequency.setValueAtTime(720,tt);o.frequency.exponentialRampToValueAtTime(420,tt+.05);pk=.28}
  else{o.type='triangle';o.frequency.setValueAtTime(1150,tt);o.frequency.exponentialRampToValueAtTime(480,tt+.04)}

/* ---------- toast notifications (reusable): toast(msg, 'success'|'error'|'warning'|'info', ms) ---------- */
function toast(msg,type,ms){
  type=['success','error','warning','info'].includes(type)?type:'info';
  if(!cfg.toasts&&(type==='info'||type==='success'))return;
  const box=$('toasts');if(!box)return;
  let live=[...box.children].filter(x=>!x._k);while(live.length>=4)killToast(live.shift());
  const el=document.createElement('div');el.className='toast '+type;
  el.setAttribute('role',type==='error'||type==='warning'?'alert':'status');
  const ic=mkIcon('t'+type);el.appendChild(ic);
  const tx=document.createElement('div');tx.className='tx';tx.textContent=msg;el.appendChild(tx);
  const cl=document.createElement('button');cl.type='button';cl.className='tcl';cl.setAttribute('aria-label',t('tClose'));cl.appendChild(mkIcon('close'));cl.onclick=()=>killToast(el);el.appendChild(cl);
  const life=ms||({error:6500,warning:5000}[type]||3200);
  const arm=d=>{clearTimeout(el._t);el._t=setTimeout(()=>killToast(el),d)};
  el.onmouseenter=()=>clearTimeout(el._t);el.onmouseleave=()=>arm(1500);
  box.appendChild(el);arm(life);
  return el;
}
function killToast(el){
  if(!el||el._k)return;el._k=1;clearTimeout(el._t);el.classList.add('out');setTimeout(()=>el.remove(),230);
}

const DEF_M=['Budi','Andi','Rizky','Fajar','Dimas','Bayu','Eko','Hadi','Iqbal','Joko','Kevin','Lutfi','Naufal','Oscar','Putra','Raka','Satria','Yoga','Zaki'];
const DEF_F=['Siti','Dewi','Ayu','Nadia','Putri','Rani','Salsa','Tika','Vina','Wulan','Yuni','Zahra','Citra','Bella','Fitri','Gita','Hana','Intan','Alya'];
function shuffled(a,rnd=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function defaultNames(){let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;return shuffled([...DEF_M,...DEF_F],rnd).join('\n')}

const ROWSL=[];SECS.forEach(s=>{for(let r=0;r<s.rows;r++)ROWSL.push({si:s.id,r,n:s.cols})});
const patOf=list=>list.map(x=>x.g);   /* one gender per desk, in seat order */
const expandRows=g=>{const out=[];let k=0;SECS.forEach(s=>{for(let r=0;r<s.rows;r++){const x=g[k++];for(let c=0;c<s.cols;c++)out.push(x)}});return out};
/* Selang-seling: inside every row the desks alternate boy / girl.
   Orientation is random per row; 3-desk rows are split evenly (3x boy-girl-boy, 3x girl-boy-girl) so totals stay equal. */
function altPattern(){
  const out=[];
  SECS.forEach(s=>{
    const ori=s.cols===3?shuffled([...Array(Math.ceil(s.rows/2)).fill(0),...Array(Math.floor(s.rows/2)).fill(1)])
                        :Array.from({length:s.rows},()=>Math.random()<.5?0:1);
    for(let r=0;r<s.rows;r++)for(let c=0;c<s.cols;c++)out.push((c+ori[r])%2===0?'M':'F');
  });
  return out;
}
/* Acak Penuh: every row holds ONE gender; which rows are male / female is random.
   Rules (relaxed step by step only if the head-count makes them impossible):
   1) male desks ~ number of males  2) both genders in each block  3) no 3 equal rows in a row
   4) no straight male/female line across left+middle+right on the same row */
function rowPattern(){
  const nb=people.filter(p=>p.g==='M').length;
  const target=people.length?Math.round(TOTAL*nb/people.length):TOTAL/2;
  const off=[0,SECS[0].rows,SECS[0].rows+SECS[1].rows];
  for(let level=0;level<4;level++){
    let best=[],bs=1e9;
    for(let k=0;k<2500;k++){
      const g=ROWSL.map(()=>Math.random()<.5?'M':'F');let ok=true;
      if(level<3)SECS.forEach((s,i)=>{const seg=g.slice(off[i],off[i]+s.rows);
        if(level<2&&(!seg.includes('M')||!seg.includes('F')))ok=false;
        if(level<1)for(let j=2;j<seg.length;j++)if(seg[j]===seg[j-1]&&seg[j]===seg[j-2])ok=false});
      if(level<2)for(let r=0;r<5;r++)if(g[off[0]+r]===g[off[1]+r]&&g[off[1]+r]===g[off[2]+r])ok=false;
      if(!ok)continue;
      const ms=g.reduce((a,x,i)=>a+(x==='M'?ROWSL[i].n:0),0),sc=Math.abs(ms-target);
      if(sc<bs){bs=sc;best=[g]}else if(sc===bs)best.push(g);
    }
    if(best.length)return expandRows(best[Math.floor(Math.random()*best.length)]);
  }
  return altPattern();
}
const pickPattern=()=>startMode==='A'?altPattern():rowPattern();
function newPattern(prev){let g,n=0;do{g=pickPattern();n++}while(n<60&&g.filter((x,i)=>x!==prev[i]).length<10);return g}
function buildSeats(pat){
  const g=pat||pickPattern();seats=[];let k=0;
  SECS.forEach(s=>{for(let r=0;r<s.rows;r++)for(let c=0;c<s.cols;c++)seats.push({sec:s.id,row:r,col:c,g:g[k++],name:null,pg:null})});
}

/* ---------- wheel (pointer on the right) ---------- */
const WR=['#e5534b','#f08c3a','#f2c33d','#4caf6e','#2fa7b8','#4a7fd6','#8f5bd1','#d9669b'];
const WP={M:['#2f6fb8','#4a90d9','#1d8fa8','#5b7fd6'],F:['#b0356f','#d9669b','#c2418a','#e3799f']};
function segAt(n){const a=2*Math.PI/n;return Math.floor((((-rot)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/a)%n}
function drawWheel(){
  const W=680,R=W/2;ctx.setTransform(canvas.width/W,0,0,canvas.width/W,0,0);ctx.clearRect(0,0,W,W);
  const{g,list}=currentPool();pool=list;
  if(!list.length){
    const cs=getComputedStyle(document.body);
    ctx.fillStyle=cs.getPropertyValue('--s4');ctx.beginPath();ctx.arc(R,R,R-8,0,7);ctx.fill();
    ctx.fillStyle=cs.getPropertyValue('--onv');ctx.font='600 40px sans-serif';ctx.textAlign='center';
    ctx.fillText(isDone()||nextIdx()<0?t('wheelDone'):t('wheelNone'),R,R+14);return;
  }
  const n=list.length,a=2*Math.PI/n,pal=cfg.pal==='rainbow'?WR:WP[g];
  ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(R,R,R-10,0,7);ctx.fillStyle=pal[0];ctx.fill();ctx.shadowBlur=0;
  list.forEach((name,i)=>{
    let ci=i%pal.length;if(i===n-1&&ci===0&&n>1)ci=2;
    ctx.beginPath();ctx.moveTo(R,R);ctx.arc(R,R,R-10,rot+i*a,rot+(i+1)*a);ctx.closePath();
    ctx.fillStyle=pal[ci];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(R,R);ctx.rotate(rot+(i+.5)*a);
    ctx.fillStyle='#fff';ctx.textAlign='right';
    ctx.font=`600 ${Math.max(20,Math.min(38,360/Math.max(n,6)))}px sans-serif`;
    ctx.fillText(name.length>13?name.slice(0,12)+'…':name,R-70,10);ctx.restore();
  });
  ctx.beginPath();ctx.arc(R,R,R-6,0,7);ctx.lineWidth=9;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.stroke();
  if(cfg.pegs)for(let i=0;i<n;i++){const an=rot+i*a;ctx.beginPath();ctx.arc(R+(R-6)*Math.cos(an),R+(R-6)*Math.sin(an),4.5,0,7);ctx.fillStyle=pal[0];ctx.fill()}
  ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(R,R,54,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle=pal[0];ctx.font='700 22px sans-serif';ctx.textAlign='center';ctx.fillText(t('wheelSpin'),R,R+8);
}

  const burst=(x,y,ang,spread,n)=>{for(let i=0;i<n;i++){

    cfP.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:(7+Math.random()*7)*sc,h:(11+Math.random()*9)*sc,

function doSpin(){
  if(spinning)return;
  if(isDone()){showFin();return}
  if(!pool.length)return;ac();if(cfg.fan==='clap'&&!muted)unlockClap();const v0=(cfg.idle&&idle)?IDLE_V:0;idle=false;
  const{g}=currentPool(),n=pool.length,a=2*Math.PI/n;
  const idx=Math.floor(Math.random()*n),target=-(idx+.5)*a;
  const delta=(((target-rot)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)+2*Math.PI*7;
  const start=rot,dur=cfg.dur*1000,t0=performance.now(),winner=pool[idx];
  // smooth start: continue from the idle speed, ease up, then decelerate to the target
  const ta=Math.min(900,dur*.3),T2=dur-ta;
  const vp=(4*delta/T2-2*ta*v0/T2)/(1+2*ta/T2),A=ta*(v0+vp)/2,D=delta-A;
  let last=segAt(n);
  spinning=true;$('spin').disabled=true;$('shuffle').disabled=true;updUR();
  (function step(ts){
    const el=Math.min(dur,ts-t0),p=el/dur;
    rot=start+(el<ta?v0*el+(vp-v0)*ta*(Math.pow(el/ta,3)-Math.pow(el/ta,4)/2):A+D*(1-Math.pow(1-(el-ta)/T2,4)));
    const sg=segAt(n);if(sg!==last){last=sg;tick();$('ptr').animate([{transform:'translateY(-50%) rotate(-24deg)'},{transform:'translateY(-50%) rotate(0)'}],{duration:110})}
    drawWheel();
    if(p<1)requestAnimationFrame(step);
    else{
      spinning=false;rot=rot%(2*Math.PI);viewRound=null;
      cp('spin');const where=place(winner,g);log('spin',{n:winner,sec:seats[lastPlaced].sec,row:seats[lastPlaced].row,r:round});
      if(isDone()&&!doneNotified){doneNotified=true;pendingFin=true}
      renderAll();showWin(winner,g,where);fanfare();
    }
  })(t0);
}

const snap=(nm)=>JSON.stringify({names:nm==null?$('names').value:nm,ov,s2:startMode,seats,round,hist:history,dn:doneNotified});
function restoreSnap(str){

const pad2=n=>String(n).padStart(2,'0');

const csvCell=v=>{let x=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(x))x="'"+x;return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};

const SEC_EN={L:'left',M:'middle',R:'right'},G_EN={M:'male',F:'female'};

  const when=new Date().toISOString(),rounds=[];
  const addR=(n,arr,cur)=>{const rows=arr.filter(x=>x&&x.name).map(x=>({round:n,section:SEC_EN[x.sec]||x.sec,row:x.row+1,column:x.col+1,name:x.name,gender:G_EN[x.pg||x.g]||''}));if(rows.length)rounds.push({round:n,current:cur,seats:rows})};

function cleanData(d){
  if(!d||typeof d!=='object')return null;
  const gs=v=>v==='M'||v==='F';
  const seat=x=>(!x||typeof x!=='object'||!['L','M','R'].includes(x.sec)||!gs(x.g))?null:{sec:x.sec,row:x.row|0,col:x.col|0,g:x.g,name:typeof x.name==='string'?x.name.slice(0,60):null,pg:gs(x.pg)?x.pg:null};
  const seatsOk=a=>{if(!Array.isArray(a)||a.length!==TOTAL)return null;const r=a.map(seat);return r.includes(null)?null:r};
  const seats=seatsOk(d.seats);if(!seats)return null;
  const hist=[];if(Array.isArray(d.hist))d.hist.slice(-9).forEach(h=>{const sx=h&&seatsOk(h.seats);if(sx)hist.push({n:Math.max(1,h.n|0),seats:sx})});
  const ov={};if(d.ov&&typeof d.ov==='object')Object.keys(d.ov).slice(0,3000).forEach(k=>{if(gs(d.ov[k]))ov[String(k).slice(0,80)]=d.ov[k]});
  return {names:typeof d.names==='string'?d.names.slice(0,30000):'',ov,s2:d.s2==='R'?'R':'A',seats,mute:!!d.mute,lang:I18N[d.lang]?d.lang:'id',round:Math.max(1,d.round|0),hist,dn:!!d.dn,cfg:(d.cfg&&typeof d.cfg==='object')?d.cfg:{}};
}
$('dSave').onclick=()=>{
  persist();let raw='{}';try{raw=localStorage.getItem(KEY)||'{}'}catch(e){}
  const blob=new Blob([JSON.stringify({app:'rolling-kelas',v:2,saved:new Date().toISOString(),data:JSON.parse(raw)},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rolling-kelas-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);log('backup');toast(t('tSaved'),'success');
};
$('dOpen').onclick=()=>$('dFile').click();
$('dFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let clean=null;try{if(f.size<2e6){const j=JSON.parse(await f.text());if(j&&j.app==='rolling-kelas')clean=cleanData(j.data)}}catch(x){}
  if(!clean){toast(t('tBadFile'),'error');return}
  if(!confirm(t('cfmImport')))return;
  try{localStorage.setItem(KEY,JSON.stringify(clean));location.reload()}catch(x){toast(t('tBadFile'),'error')}
};

const FAQ={

['Is my data private?','Yes. The names and seating plans you enter stay in your own browser (local storage on this device). They are never uploaded to a server, there is no account or sign-up, and this site uses no analytics or advertising trackers. You can erase everything at any time with the button below. As with any website, the hosting provider may keep standard server logs.'],

      const row=document.createElement('div');row.className='row';
      const w=document.createElement('button');w.className='btn tonal sm';w.insertBefore(mkIcon('delete'),null);const wl=document.createElement('span');wl.textContent=t('wipe');w.appendChild(wl);w.onclick=wipeData;
      const pb=document.createElement('button');pb.className='btn text sm';pb.appendChild(mkIcon('lock'));const pl=document.createElement('span');pl.textContent=t('polLink');pb.appendChild(pl);pb.onclick=openPolicy;
      row.append(w,pb);d.appendChild(row);
    }
    box.appendChild(d);
  });
}
function renderPolicy(){
  const P=POL[lang];$('polTitle').textContent=P.title;$('polUpd').textContent=t('polUpd');
  const b=$('polBody');b.innerHTML='';
  P.sections.forEach(([h,x])=>{const e=document.createElement('h4');e.textContent=h;const q=document.createElement('p');q.textContent=x;b.append(e,q)});
}
function openPolicy(){$('policy').classList.add('show')}
const closePolicy=()=>$('policy').classList.remove('show');
$('polLink').onclick=openPolicy;$('polClose').onclick=closePolicy;$('polWipe').onclick=wipeData;
$('policy').onclick=e=>{if(e.target.id==='policy')closePolicy()};
const toFaq=()=>$('faq').scrollIntoView({behavior:'smooth'});
$('faqLink').onclick=toFaq;$('faqBtn').onclick=toFaq;

/* ---------- export the seating plan ---------- */
const viewN=()=>viewRound===null?round:history[viewRound].n;
function seatText(){
  const L=viewSeats();let out=`Rolling Kelas · Rolling #${viewN()}\n`;
  SECS.forEach(s=>{out+=`\n${t('sec'+s.id)}\n`;for(let r=0;r<s.rows;r++){out+=`${t('row')} ${r+1}: ${L.filter(x=>x.sec===s.id&&x.row===r).map(x=>x.name||'-').join(' | ')}\n`}});
  return out;
}
$('expCopy').onclick=async()=>{
  const txt=seatText();
  try{await navigator.clipboard.writeText(txt);toast(t('tCopied'),'success')}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('tCopied'),'success')}catch(_){toast(t('tCopyFail'))}ta.remove()}
};
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function seatCanvas(){
  const L=viewSeats(),W=1240,sw=100,sh=60,sg=10,gap=44,top=150;
  const bw=SECS.map(s=>s.cols*sw+(s.cols-1)*sg),total=bw.reduce((a,b)=>a+b,0)+gap*(SECS.length-1),x0=(W-total)/2;
  const H=top+Math.max(...SECS.map(s=>s.rows))*(sh+sg)+100;
  const c=document.createElement('canvas');c.width=W*2;c.height=H*2;const g=c.getContext('2d');g.scale(2,2);
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textAlign='center';
  g.fillStyle='#1a1c18';g.font='700 30px sans-serif';g.fillText('Rolling Kelas · Rolling #'+viewN(),W/2,50);
  g.fillStyle='#e0e4d9';rr(g,W/2-190,68,380,38,12);g.fill();g.fillStyle='#43483e';g.font='700 15px sans-serif';g.fillText(t('board'),W/2,92);
  let x=x0;
  SECS.forEach((s,i)=>{
    g.fillStyle='#43483e';g.font='600 16px sans-serif';g.textAlign='center';g.fillText(`${t('sec'+s.id)} (${s.cols*s.rows})`,x+bw[i]/2,top-14);
    L.filter(q=>q.sec===s.id).forEach(q=>{
      const sx=x+q.col*(sw+sg),sy=top+q.row*(sh+sg);rr(g,sx,sy,sw,sh,14);
      if(q.name){
        g.fillStyle=q.pg==='M'?'#d3e4ff':'#ffd8e8';g.fill();g.fillStyle=q.pg==='M'?'#001c3b':'#3e001e';
        let f=17;g.font='700 '+f+'px sans-serif';while(g.measureText(q.name).width>sw-14&&f>9){f--;g.font='700 '+f+'px sans-serif'}
        g.textAlign='center';g.fillText(q.name,sx+sw/2,sy+sh/2+f/3);
      }else{g.setLineDash([5,4]);g.lineWidth=1.5;g.strokeStyle=q.g==='M'?'#5b97dc':'#d9669b';g.stroke();g.setLineDash([])}
    });
    x+=bw[i]+gap;
  });
  g.textAlign='left';g.font='600 14px sans-serif';
  g.fillStyle='#2f6fb8';rr(g,W/2-130,H-52,14,14,3);g.fill();g.fillStyle='#43483e';g.fillText(t('boys'),W/2-110,H-40);
  g.fillStyle='#b0356f';rr(g,W/2+20,H-52,14,14,3);g.fill();g.fillStyle='#43483e';g.fillText(t('girls'),W/2+40,H-40);
  return c;
}
$('expImg').onclick=()=>seatCanvas().toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='rolling-kelas-'+viewN()+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast(t('tImg'))});
$('expPrint').onclick=()=>window.print();

/* ---------- header auto-hide, fullscreen, keyboard, idle wheel ---------- */
const hdr=document.querySelector('header');let lastY=0;
addEventListener('scroll',()=>{
  const y=window.scrollY;if(Math.abs(y-lastY)<6)return;
  hdr.classList.toggle('scrolled',y>10);
  if(y>90&&y>lastY&&!$('langMenu').classList.contains('open'))hdr.classList.add('hide');else hdr.classList.remove('hide');
  lastY=y;
},{passive:true});
if(!document.documentElement.requestFullscreen)$('fs').style.display='none';
$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})};
document.addEventListener('fullscreenchange',()=>{const pa=$('fs').querySelector('path');if(pa)pa.setAttribute('d',ICONS[document.fullscreenElement?'exitfs':'fullscreen'])});
const deskMQ=matchMedia('(min-width:960px)');
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!document.querySelector('.win.show')&&document.body.classList.contains('focus')){setFocus(false);return}closeCfg();closeAct();closePolicy();hideFin();hideWin();return}
  const kk=(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(kk==='z'||kk==='y')&&!['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName)&&!e.target.isContentEditable){
    e.preventDefault();if(document.querySelector('.win.show'))return;
    if(kk==='y'||e.shiftKey)doRedo();else doUndo();return}
  if(e.code!=='Space'||e.repeat)return;
  if(['TEXTAREA','INPUT','BUTTON','SUMMARY','A','SELECT'].includes(e.target.tagName))return;
  if(document.querySelector('.win.show'))return;
  if(!deskMQ.matches&&tab!==1)return;
  e.preventDefault();doSpin();
});
const IDLE_V=.00021;let idleT=0;
let idle=!matchMedia('(prefers-reduced-motion: reduce)').matches;
(function idleLoop(ts){
  const dt=Math.min(50,ts-idleT);idleT=ts;
  if(cfg.idle&&idle&&!spinning&&pool.length&&!document.hidden&&$('t1').offsetParent!==null){rot=(rot+IDLE_V*dt)%(2*Math.PI);drawWheel()}
  requestAnimationFrame(idleLoop);
})(0);

initIcons();

actLoad();load();applyCfg();applyLang();
/* deep links from the info pages: index.html#privacy opens the policy, #faq jumps to the FAQ */
function hashNav(){const h=location.hash;if(h==='#privacy')openPolicy();else if(h==='#faq'){go(1);setTimeout(toFaq,350)}}
hashNav();addEventListener('hashchange',hashNav);
</script>
